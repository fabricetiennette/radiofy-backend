spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  mail:
    host: localhost
    port: 1025
    username:
    password:
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
      mail.smtp.ssl.enable: false
      mail.smtp.port: 1025

apple:
  client-id: ${APPLE_CLIENT_ID}

radio-browser:
  base-url: ${RADIO_BROWSER_BASE_URL:?missing RADIO_BROWSER_BASE_URL}
  user-agent: ${RADIO_BROWSER_USER_AGENT:?missing RADIO_BROWSER_USER_AGENT}